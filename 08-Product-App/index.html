<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    <h1>Product App 🛒</h1>


    <div class="buttons">

        <button id="all-btn">All Products</button>

        <button id="electronics-btn">Electronics</button>

        <button id="fashion-btn">Fashion</button>

        <button id="discount-btn"> 10% Discounted Products <br>
        </button>

        <button id="total-btn">Calculate Total</button>

    </div>



    <div>

        <input 
        type="text" 
        id="search-input"
        placeholder="Search product">


        <button id="search-btn">
            Search
        </button>

    </div>



    <h2 id="message"></h2>



    <div id="products"></div>



    <h2 id="total"></h2>




<script src="app.js"></script>

</body>

</html>
