<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1> Finance App</h1>


        <!-- Balance Section -->

        <div class="balance-card">

            <h3>Current Balance</h3>

            <h2 id="balance">
                Rs 0
            </h2>

        </div>



        <!-- Income Expense -->

        <div class="summary">

            <div class="box income">

                <h3>Income</h3>

                <p id="income">
                    Rs 0
                </p>

            </div>


            <div class="box expense">

                <h3>Expense</h3>

                <p id="expense">
                    Rs 0
                </p>

            </div>

        </div>



        <!-- Add Transaction -->

        <div class="form">

            <h2>Add Transaction</h2>


            <input type="text" id="title" placeholder="Transaction name">


            <input type="number" id="amount" placeholder="Amount">


            <select id="type">

                <option value="income">
                    Income
                </option>

                <option value="expense">
                    Expense
                </option>

            </select>


            <button id="add-btn">
                Add Transaction
            </button>


        </div>



        <!-- Search -->

        <input type="text" id="search" placeholder="Search transaction">



        <!-- Transaction List -->

        <h2>
            Transactions
        </h2>


        <ul id="transaction-list">

        </ul>


    </div>



    <script src="js/transaction.js"></script>

    <script src="js/storage.js"></script>

    <script src="js/app.js"></script>


</body>

</html>
